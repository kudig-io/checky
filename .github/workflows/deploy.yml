name: Deploy Pages

# push(main)/手动触发：构建站点并发布到 GitHub Pages（TODO.md P6）
# 依赖：仓库已公开 + Pages 已启用 build_type=workflow（2026-11-25 完成）
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建站点（注入 Pages base）
        run: npm run build
        env:
          VITEPRESS_BASE: /checky/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .vitepress/dist

      # 新仓库 artifact 元数据传播可达分钟级，deploy-pages 上传后亚秒内查询会拿到 0
      # （run 45586172800 / 45600861232 稳定复现）——先轮询到 API 可见再部署
      - name: 等待 artifact 元数据可见
        run: |
          for i in $(seq 1 30); do
            n=$(curl -sf -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?name=github-pages" \
              | grep -oE '"total_count": *[0-9]+' | grep -oE '[0-9]+' || echo 0)
            echo "attempt $i: total_count=$n"
            [ "${n:-0}" -ge 1 ] && exit 0
            sleep 10
          done
          echo "artifact 5 分钟内未可见，判定失败"; exit 1

      - id: deployment
        uses: actions/deploy-pages@v4
